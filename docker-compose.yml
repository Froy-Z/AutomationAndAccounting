services:
    mysql:
        image: mysql:8.4.4
        container_name: mysql_container1
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: first_db
            MYSQL_USER: username
            MYSQL_PASSWORD: password
        ports:
            - "1212:3306"
        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
